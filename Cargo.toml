[package]
name = "findthepackage"
version = "0.1.0"
edition = "2021"
description = "FindThePackage - a slick terminal UI that maps everything installed on your Linux box to the package that owns it"
license = "MIT"

[[bin]]
name = "findthepackage"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[dependencies]
ratatui = "0.30.2"
